name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Executa um comando e, se falhar, mostra o final do log como anotação de erro
      - name: Preparar registro de erros
        run: |
          cat > "$RUNNER_TEMP/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -o pipefail
          name="$1"; shift
          log="$RUNNER_TEMP/$(echo "$name" | tr ' ' '_').log"
          if "$@" 2>&1 | tee "$log"; then exit 0; fi
          msg=$(grep -v '^\s*$' "$log" | tail -n 70 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$name::$msg"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/run.sh"

      - name: Instalar dependências
        run: |
          "$RUNNER_TEMP/run.sh" "npm install (expo)" npm install --legacy-peer-deps --no-audit --no-fund
          "$RUNNER_TEMP/run.sh" "fixar versoes" node scripts/setup-deps.js
          "$RUNNER_TEMP/run.sh" "npm install" npm install --no-audit --no-fund

      - name: Testes da lógica
        run: '"$RUNNER_TEMP/run.sh" "testes" npx --yes tsx --test tests/logica.test.ts'

      - name: Checagem de tipos
        continue-on-error: true
        run: '"$RUNNER_TEMP/run.sh" "tipos" npx tsc --noEmit'

      - name: Gerar projeto Android
        run: '"$RUNNER_TEMP/run.sh" "prebuild" npx expo prebuild --platform android --no-install'

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar APK
        working-directory: android
        run: '"$RUNNER_TEMP/run.sh" "gradle" ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a'

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AgendaInteligente.apk
          VER=$(node -p "require('./app.json').expo.version.split('.').slice(0,2).join('.')")
          TAG="v${VER}.${{ github.run_number }}"
          gh release create "$TAG" AgendaInteligente.apk \
            --title "Agenda Inteligente $TAG" \
            --notes "Baixe o arquivo AgendaInteligente.apk pelo celular e toque nele para instalar." \
            --latest
